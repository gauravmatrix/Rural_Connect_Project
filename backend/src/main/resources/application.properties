spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rural_connect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sql@123}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Error Response Hardening
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Server Port
server.port=${APP_PORT:8080}
app.server.auto-port-fallback=${APP_AUTO_PORT_FALLBACK:true}
app.server.fallback-port=${APP_FALLBACK_PORT:8081}

# Mail Configuration (Phase 3)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@example.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Keep true for local development unless SMTP credentials are configured
app.mail.mock-enabled=${MAIL_MOCK_ENABLED:true}

# OTP Security
app.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.otp.lock-minutes=${OTP_LOCK_MINUTES:15}

# CORS Security
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}

# Escalation scheduler (Phase 6)
app.escalation.scheduler-delay-ms=${ESCALATION_SCHEDULER_DELAY_MS:5000}

# JWT Configuration (Phase 10)
app.jwt.secret=${JWT_SECRET_BASE64:U3VwZXJTZWNyZXRLZXlGb3JSdXJhbENvbm5lY3QxMjM0NTY3ODkwMTIzNDU2Nzg5MA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}